<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

  <title>Tom's工房 売上・納品入力</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tom's工房">
  <meta name="theme-color" content="#745038">

  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <link rel="icon" type="image/png" href="./icon-180.png">

  <style>
    :root {
      --bg1:#dbc29f;
      --bg2:#efe1cc;
      --card:#fffaf1;
      --ink:#3d2b20;
      --line:#c7a47c;
      --brown:#745038;
      --brown-dark:#4b3020;
      --blue:#426d70;
      --orange:#b96f31;
      --danger:#a44739;
      --ok:#547755;
    }

    * { box-sizing:border-box; }

    html, body {
      width:100%;
      margin:0;
      padding:0;
    }

    body {
      background:
        repeating-linear-gradient(
          94deg,
          rgba(88,53,31,.035) 0,
          rgba(88,53,31,.035) 2px,
          rgba(255,255,255,.025) 2px,
          rgba(255,255,255,.025) 11px
        ),
        linear-gradient(
          135deg,
          var(--bg1) 0%,
          var(--bg2) 48%,
          #d6b58b 100%
        );

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

      color:var(--ink);
      -webkit-text-size-adjust:100%;
    }

    button,
    input,
    select {
      font:inherit;
    }

    .wrap {
      width:100%;
      max-width:760px;
      margin:0 auto;
      padding:8px 8px 26px;
    }

    h1 {
      margin:6px 4px 1px;
      color:var(--brown-dark);
      font-size:28px;
      font-weight:900;
      letter-spacing:.02em;
    }

    .sub {
      margin:0 4px 11px;
      color:#765e4b;
      font-size:15px;
      font-weight:600;
    }

    .card {
      width:100%;
      margin:9px 0;
      padding:16px;
      background:linear-gradient(145deg,rgba(255,252,245,.98),rgba(246,232,211,.98));
      border:1px solid rgba(103,67,42,.20);
      border-radius:17px;
      box-shadow:0 3px 10px rgba(77,48,30,.12);
    }

    .label {
      margin:0 0 10px;
      color:var(--brown-dark);
      font-size:17px;
      font-weight:900;
    }

    .grid2 {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    input[type=date] {
      width:100%;
      min-height:62px;
      padding:10px 12px;
      border:1.5px solid var(--line);
      border-radius:12px;
      background:#fffdf8;
      color:var(--ink);
      font-size:20px;
      font-weight:700;
    }

    .choice {
      width:100%;
      border:2px solid #ccb18f;
      border-radius:13px;
      background:linear-gradient(145deg,#fffdf8,#f0dfc6);
      color:var(--ink);
      font-weight:800;
    }

    .store-choice {
      min-height:142px;
      padding:10px 6px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:7px;
      transition:border-color .15s,background .15s,transform .08s;
    }

    .store-choice img {
      display:block;
      width:84px;
      height:84px;
      object-fit:contain;
      border-radius:10px;
    }

    .store-name {
      min-height:39px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      font-size:15px;
      line-height:1.3;
    }

    .store-choice.active {
      border-color:var(--blue);
      background:linear-gradient(145deg,#edf5f2,#dce9e5);
      color:#315c5f;
      box-shadow:0 0 0 2px rgba(66,109,112,.12);
    }

    .store-choice:active {
      transform:scale(.985);
    }

    .type-choice {
      min-height:76px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      font-size:20px;
    }

    .type-icon {
      width:38px;
      height:38px;
      flex:0 0 38px;
    }

    .sale.active {
      border-color:var(--orange);
      background:linear-gradient(145deg,#fff5e8,#f4dfc5);
      color:#9c591f;
    }

    .delivery.active {
      border-color:var(--blue);
      background:linear-gradient(145deg,#edf5f2,#dce9e5);
      color:#315c5f;
    }

    .product-row {
      min-width:0;
      min-height:134px;
      padding:10px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      border:1px solid #c8a47c;
      border-radius:13px;
      background:linear-gradient(145deg,#fffaf1,#efdabc);
    }

    .product-row.has-qty {
      border-color:#8a6547;
      background:linear-gradient(145deg,#fff6e9,#e7cba5);
    }

    .product-name {
      min-height:52px;
      display:flex;
      align-items:flex-start;
      color:#4b3020;
      font-size:15px;
      font-weight:900;
      line-height:1.35;
      word-break:break-word;
    }

    .qty-control {
      display:grid;
      grid-template-columns:minmax(0,1fr) 46px;
      gap:5px;
      margin-top:7px;
    }

    .qty-input {
      width:100%;
      min-width:0;
      height:47px;
      padding:0 3px;
      border:1.5px solid #b88f64;
      border-radius:9px;
      background:#fffdf8;
      color:#3c291c;
      text-align:center;
      font-size:21px;
      font-weight:900;
    }

    .qty-select {
      width:46px;
      height:47px;
      border:1.5px solid #b88f64;
      border-radius:9px;
      background:#ead4b5;
      color:var(--brown-dark);
      font-size:17px;
      font-weight:900;
    }

    .summary {
      display:grid;
      grid-template-columns:auto 1fr;
      gap:8px 14px;
      font-size:17px;
    }

    .summary span {
      color:#725d4d;
      font-weight:700;
    }

    .summary b {
      color:var(--brown-dark);
      text-align:right;
      font-size:18px;
    }

    .selected-products {
      margin-top:12px;
      padding-top:10px;
      border-top:1px solid #d8c1a3;
    }

    .selected-line {
      padding:6px 0;
      display:flex;
      justify-content:space-between;
      gap:10px;
      border-bottom:1px dashed rgba(116,80,56,.18);
      font-size:15px;
    }

    .history-head {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }

    .smallBtn {
      padding:9px 11px;
      border:1px solid #c6a888;
      border-radius:9px;
      background:#fff8ef;
      font-weight:800;
    }

    .danger {
      color:var(--danger);
    }

    .history-row {
      padding:11px 0;
      display:flex;
      justify-content:space-between;
      gap:10px;
      border-bottom:1px solid #e0ccb3;
      font-size:14px;
    }

    .note {
      margin-top:12px;
      padding-left:3px;
      color:#735e4d;
      font-size:14px;
      line-height:1.5;
    }

    .register {
      margin-top:14px;
    }

    .register button {
      width:100%;
      min-height:68px;
      border:1px solid #40291b;
      border-radius:14px;
      background:linear-gradient(135deg,#855c3d,#493020);
      color:#fffaf1;
      font-size:22px;
      font-weight:900;
    }

    .toast {
      display:none;
      position:fixed;
      top:14px;
      left:50%;
      transform:translateX(-50%);
      z-index:50;
      padding:12px 18px;
      border-radius:999px;
      background:var(--ok);
      color:#fff;
      font-weight:900;
    }

    .loading {
      opacity:.55;
      pointer-events:none;
    }

    .products-placeholder{
      padding:20px 8px;
      text-align:center;
      color:#7c6857;
      font-weight:800;
      line-height:1.6;
    }

    .product-columns{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
      align-items:start;
    }

    .product-column{
      display:grid;
      gap:10px;
      min-width:0;
    }

    .product-price{
      margin-top:4px;
      color:#80634c;
      font-size:13px;
      font-weight:800;
    }

    .top-tabs{
      position:sticky;
      top:0;
      z-index:30;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:6px;
      margin:8px 0 12px;
      padding:6px;
      background:rgba(239,225,204,.94);
      border-radius:14px;
    }

    .top-tab{
      min-height:46px;
      border:1px solid #c7a47c;
      border-radius:10px;
      background:#fff8ef;
      font-size:13px;
      font-weight:900;
    }

    .top-tab.active{
      background:linear-gradient(135deg,#855c3d,#493020);
      color:#fffaf1;
    }

    .app-view{display:none}
    .app-view.active{display:block}

    .dash-toolbar{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin-bottom:10px;
    }

    .dash-filter{
      flex:1 1 145px;
      min-height:46px;
      padding:8px 10px;
      border:1.5px solid var(--line);
      border-radius:10px;
      background:#fffdf8;
      font-weight:800;
    }

    .dash-refresh{
      min-height:46px;
      padding:8px 12px;
      border:1px solid #9e8065;
      border-radius:10px;
      background:#f3e3ce;
      font-weight:900;
    }

    .dash-updated{
      margin:4px 2px 10px;
      color:#735e4d;
      font-size:12px;
      font-weight:700;
    }

    .metric{
      padding:13px 10px;
      border:1px solid #d1b493;
      border-radius:12px;
      background:#fffaf2;
      text-align:center;
    }

    .metric-label{
      color:#79614e;
      font-size:12px;
      font-weight:800;
    }

    .metric-value{
      margin-top:5px;
      color:#4b3020;
      font-size:22px;
      font-weight:900;
    }

    .dash-table-wrap{
      overflow-x:auto;
      border:1px solid #d1b493;
      border-radius:12px;
      background:#fffdf8;
    }

    .dash-table{
      width:100%;
      border-collapse:collapse;
      font-size:13px;
    }

    .dash-table th,
    .dash-table td{
      padding:10px 8px;
      border-bottom:1px solid #ead8c2;
      text-align:right;
    }

    .dash-table th:first-child,
    .dash-table td:first-child{
      text-align:left;
    }

    .month-list{
      display:grid;
      gap:8px;
    }

    .month-row{
      display:grid;
      grid-template-columns:88px 1fr 1fr;
      gap:8px;
      align-items:center;
      padding:11px 10px;
      border:1px solid #d8bea0;
      border-radius:11px;
      background:#fffaf2;
    }

    .month-row .m{
      font-weight:900;
    }

    .month-row .v{
      text-align:right;
      font-weight:900;
    }

    .inventory-table{
      width:100%;
      min-width:0;
      table-layout:fixed;
    }

    .inventory-only-stock th:first-child,
    .inventory-only-stock td:first-child{
      width:76%;
      text-align:left;
    }

    .inventory-only-stock th:nth-child(2),
    .inventory-only-stock td:nth-child(2){
      width:24%;
      text-align:center;
      font-weight:900;
    }

    .stock-minus{
      color:#a44739;
      font-weight:900;
    }
  </style>
</head>

<body>

<div id="toast" class="toast">登録しました</div>

<div id="app" class="wrap">

  <h1>Tom's工房 売上・納品入力</h1>
  <div class="sub">店舗ごとに取扱商品が自動で切り替わります</div>

  <div class="top-tabs">
    <button class="top-tab active" type="button" data-view="input" onclick="switchView('input')">入力</button>
    <button class="top-tab" type="button" data-view="inventory" onclick="switchView('inventory')">在庫</button>
    <button class="top-tab" type="button" data-view="monthly" onclick="switchView('monthly')">月別</button>
    <button class="top-tab" type="button" data-view="products" onclick="switchView('products')">商品別</button>
  </div>

  <section id="view-input" class="app-view active">

    <div class="card">
      <div class="label">日付</div>
      <input type="date" id="date">
    </div>

    <div class="card">
      <div class="label">店舗</div>
      <div id="storeButtons" class="grid2"></div>
    </div>

    <div class="card">

      <div class="label">区分</div>

      <div class="grid2">

        <button
          id="saleBtn"
          type="button"
          class="choice type-choice sale"
        >
          <svg class="type-icon" viewBox="0 0 48 48">
            <path d="M10 17h28l-2.5 23h-23z" fill="none" stroke="currentColor" stroke-width="3"/>
            <path d="M17 18v-3a7 7 0 0 1 14 0v3" fill="none" stroke="currentColor" stroke-width="3"/>
            <path d="M20 25h8M24 22v13M19.5 30h9" fill="none" stroke="currentColor" stroke-width="2.5"/>
          </svg>
          <span>販売</span>
        </button>

        <button
          id="deliveryBtn"
          type="button"
          class="choice type-choice delivery"
        >
          <svg class="type-icon" viewBox="0 0 48 48">
            <path d="M8 17 24 9l16 8v20L24 44 8 37z" fill="none" stroke="currentColor" stroke-width="3"/>
            <path d="M8 17l16 9 16-9M24 26v18" fill="none" stroke="currentColor" stroke-width="3"/>
            <path d="M24 3v13M18 10l6 6 6-6" fill="none" stroke="currentColor" stroke-width="3"/>
          </svg>
          <span>納品</span>
        </button>

      </div>
    </div>

    <div class="card">
      <div class="label">商品・数量</div>
      <div id="productArea"></div>
    </div>

    <div class="card">

      <div class="summary">

        <span>店舗</span>
        <b id="sumStore">未選択</b>

        <span>区分</span>
        <b id="sumType">納品</b>

        <span>選択商品数</span>
        <b id="sumCount">0商品</b>

        <span>合計数量</span>
        <b id="sumQty">0個</b>

        <span>売上金額</span>
        <b id="sumAmount">－</b>

      </div>

      <div id="selectedProducts" class="selected-products"></div>

    </div>

    <div class="card">

      <div class="history-head">
        <div class="label" style="margin:0">最近の登録</div>

        <button
          type="button"
          class="smallBtn danger"
          onclick="undoLastBatch()"
        >
          直前を取消
        </button>
      </div>

      <div id="history"></div>

    </div>

    <div class="register">
      <button id="registerBtn" type="button" onclick="registerEntries()">
        この内容で登録
      </button>
    </div>

  </section>

  <section id="view-inventory" class="app-view">

    <div class="card">

      <div class="label">在庫一覧</div>

      <div class="dash-toolbar">

        <select id="inventoryStore" class="dash-filter" onchange="renderInventory()">
          <option value="全店舗">全店舗</option>
          <option value="南城市地域物産館">南城市地域物産館</option>
          <option value="南の駅やえせ">南の駅やえせ</option>
        </select>

        <button class="dash-refresh" type="button" onclick="loadDashboard(true)">
          最新に更新
        </button>

      </div>

      <div id="inventoryUpdated" class="dash-updated"></div>
      <div id="inventoryContent">読み込み前です</div>

    </div>

  </section>

  <section id="view-monthly" class="app-view">

    <div class="card">

      <div class="label">月別集計</div>

      <div class="dash-toolbar">

        <select id="monthlyStore" class="dash-filter" onchange="renderMonthly()">
          <option value="全店舗">全店舗</option>
          <option value="南城市地域物産館">南城市地域物産館</option>
          <option value="南の駅やえせ">南の駅やえせ</option>
        </select>

        <button class="dash-refresh" type="button" onclick="loadDashboard(true)">
          最新に更新
        </button>

      </div>

      <div id="monthlyUpdated" class="dash-updated"></div>
      <div id="monthlyContent">読み込み前です</div>

    </div>

  </section>

  <section id="view-products" class="app-view">

    <div class="card">

      <div class="label">商品別月次販売</div>

      <div class="dash-toolbar">

        <select id="productStore" class="dash-filter" onchange="renderProductMonthly()">
          <option value="全店舗">全店舗</option>
          <option value="南城市地域物産館">南城市地域物産館</option>
          <option value="南の駅やえせ">南の駅やえせ</option>
        </select>

        <select id="productMonth" class="dash-filter" onchange="renderProductMonthly()"></select>

        <button class="dash-refresh" type="button" onclick="loadDashboard(true)">
          最新に更新
        </button>

      </div>

      <div id="productsUpdated" class="dash-updated"></div>
      <div id="productsContent">読み込み前です</div>

    </div>

  </section>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzzp5BCz__MdBl2FSQo1SUNygKjorB_ZhbThI_Tvy0FXZvECr3AkqLKRG3XgA9dsNG86A/exec";

/*
  ここには現在使っている店舗キャラクター画像の
  Base64データをそのまま残してください。
*/
const STORE_IMAGES = {
  "南城市地域物産館":"ここに現在の南城市キャラクター画像Base64",
  "南の駅やえせ":"ここに現在の南の駅やえせキャラクター画像Base64"
};


const STORE_PRODUCTS = {

  "南城市地域物産館":[
    {name:"美らサンドグラス",price:800},
    {name:"美らサンドタンブラー黒",price:1800},
    {name:"美らサンドタンブラー白",price:1800},
    {name:"美らタンブラー2個",price:3500},
    {name:"タンブラー白ハイビ柄",price:1800},
    {name:"タンブラー黒ハイビ柄",price:1800},
    {name:"タンブラー ハイビ柄2個",price:3500},
    {name:"ランチボックス カーキー",price:1800},
    {name:"ランチボックス オレンジ",price:1800},
    {name:"コルクコースター 1個",price:180},
    {name:"コルクコースター 2個セット",price:350},
    {name:"魔除けのサン付y2k",price:550},
    {name:"沖縄ストラップS",price:660},
    {name:"沖縄ストラップM",price:800},
    {name:"島ぞうり",price:2000},
    {name:"ワンポイント島ぞうり",price:1200}
  ],

  "南の駅やえせ":[
    {name:"美らサンドタンブラー黒",price:1800},
    {name:"美らサンドタンブラー白",price:1800},
    {name:"美らタンブラー2個",price:3500},
    {name:"タンブラー白ハイビ柄",price:1800},
    {name:"タンブラー黒ハイビ柄",price:1800},
    {name:"タンブラー ハイビ柄2個",price:3500},
    {name:"コルクコースター 1個",price:180},
    {name:"コルクコースター 2個セット",price:350},
    {name:"シーちゃんコースターA",price:180},
    {name:"シーちゃんコースターB",price:180},
    {name:"シーちゃんコースターC",price:180},
    {name:"シーちゃんマグ やえせシーちゃん",price:1500},
    {name:"シーちゃんマグ 海と特産品",price:1500},
    {name:"シーちゃんマグ めんそーれ",price:1500},
    {name:"シーちゃん願い事チャーム",price:400},
    {name:"魔除けのサン付ストラップ",price:550},
    {name:"パラコード部活ストラップ",price:550}
  ]

};


const STORES = Object.keys(STORE_PRODUCTS);


let state = {
  store:localStorage.getItem("toms_store") || "",
  type:localStorage.getItem("toms_type") || "納品",
  quantities:{}
};


function localToday(){

  const d = new Date();

  const tz =
  d.getTimezoneOffset() * 60000;

  return new Date(d - tz)
  .toISOString()
  .slice(0,10);

}


document.getElementById("date").value =
localToday();


const storeBox =
document.getElementById("storeButtons");

const productArea =
document.getElementById("productArea");

const saleBtn =
document.getElementById("saleBtn");

const deliveryBtn =
document.getElementById("deliveryBtn");

const registerBtn =
document.getElementById("registerBtn");


STORES.forEach(store=>{

  const b =
  document.createElement("button");

  b.type =
  "button";

  b.className =
  "choice store-choice";

  b.dataset.store =
  store;

  b.innerHTML =
  `<img src="${STORE_IMAGES[store]}" alt=""><span class="store-name">${store}</span>`;

  b.addEventListener(
    "click",
    ()=>setStore(store)
  );

  storeBox.appendChild(b);

});


saleBtn.onclick =
()=>setType("販売");

deliveryBtn.onclick =
()=>setType("納品");


function currentProducts(){

  return state.store
  ? STORE_PRODUCTS[state.store]
  : [];

}


function qtyKey(productName){

  return state.store +
  "||" +
  productName;

}


function getQty(productName){

  return state.quantities[
    qtyKey(productName)
  ] || "";

}


function setQty(productName,value){

  const key =
  qtyKey(productName);

  if(value === ""){

    delete state.quantities[key];

  }else{

    state.quantities[key] =
    value;

  }

}


function setStore(store){

  if(
    state.store !== store
  ){

    state.quantities = {};

  }

  state.store =
  store;

  localStorage.setItem(
    "toms_store",
    store
  );

  render();

}


function setType(type){

  state.type =
  type;

  localStorage.setItem(
    "toms_type",
    type
  );

  render();

}


function selectedItems(){

  return currentProducts()

  .map(product=>({

    product,

    qty:
    Number(
      getQty(product.name)
    )

  }))

  .filter(x=>
    Number.isFinite(x.qty) &&
    (
      (x.qty >= -30 && x.qty <= -1) ||
      x.qty >= 1
    )
  );

}


function yen(n){

  return Number(n)
  .toLocaleString("ja-JP") +
  "円";

}


function renderProducts(){

  if(!state.store){

    productArea.innerHTML = `
      <div class="products-placeholder">
        先に店舗を選択してください。
      </div>
    `;

    return;

  }


  const products =
  currentProducts();


  const split =
  Math.ceil(
    products.length / 2
  );


  const left =
  products.slice(
    0,
    split
  );


  const right =
  products.slice(
    split
  );


  productArea.innerHTML = `
    <div class="product-columns">
      <div class="product-column" id="productColLeft"></div>
      <div class="product-column" id="productColRight"></div>
    </div>
  `;


  renderProductColumn(
    document.getElementById("productColLeft"),
    left
  );


  renderProductColumn(
    document.getElementById("productColRight"),
    right
  );

}


function renderProductColumn(container,products){

  products.forEach(product=>{

    const row =
    document.createElement("div");


    const qty =
    Number(
      getQty(product.name)
    );


    row.className =
    "product-row" +
    (
      Number.isFinite(qty) &&
      (
        (qty >= -30 && qty <= -1) ||
        qty >= 1
      )
      ? " has-qty"
      : ""
    );


    row.dataset.product =
    product.name;


    const nameWrap =
    document.createElement("div");


    nameWrap.innerHTML = `
      <div class="product-name">
        ${product.name}
      </div>

      <div class="product-price">
        @${product.price.toLocaleString("ja-JP")}
      </div>
    `;


    const control =
    document.createElement("div");


    control.className =
    "qty-control";


    const input =
    document.createElement("input");


    input.type =
    "number";

    input.inputMode =
    "numeric";

    input.min =
    "-30";

    input.max =
    "99";

    input.step =
    "1";

    input.placeholder =
    "数量";

    input.className =
    "qty-input";

    input.value =
    getQty(product.name);


    input.addEventListener(
      "input",
      ()=>{

        if(input.value === ""){

          setQty(
            product.name,
            ""
          );

        }else{

          const n =
          Number(
            input.value
          );

          if(
            Number.isFinite(n)
          ){

            setQty(
              product.name,
              n
            );

          }

        }


        renderSummaryOnly();

        updateProductHighlights();

      }
    );


    input.addEventListener(
      "blur",
      ()=>{

        if(input.value === ""){

          setQty(
            product.name,
            ""
          );

        }else{

          let v =
          Math.round(
            Number(
              input.value
            )
          );


          if(
            !Number.isFinite(v)
          ){

            v = 1;

          }


          if(v === 0){

            input.value =
            "";

            setQty(
              product.name,
              ""
            );

          }else{

            v =
            Math.min(
              99,
              Math.max(
                -30,
                v
              )
            );


            input.value =
            v;


            setQty(
              product.name,
              v
            );

          }

        }


        renderSummaryOnly();

        updateProductHighlights();

      }
    );


    const select =
    document.createElement("select");


    select.className =
    "qty-select";


    const blank =
    document.createElement("option");


    blank.value =
    "";

    blank.textContent =
    "▼";


    select.appendChild(
      blank
    );


    // マイナス数量：-1 ～ -30
    for(
      let n = -1;
      n >= -30;
      n--
    ){

      const o =
      document.createElement("option");

      o.value =
      n;

      o.textContent =
      n;

      select.appendChild(
        o
      );

    }


    // プラス数量：1 ～ 30
    for(
      let n = 1;
      n <= 30;
      n++
    ){

      const o =
      document.createElement("option");

      o.value =
      n;

      o.textContent =
      n;

      select.appendChild(
        o
      );

    }


    select.addEventListener(
      "change",
      ()=>{

        if(
          select.value !== ""
        ){

          const v =
          Number(
            select.value
          );


          input.value =
          v;


          setQty(
            product.name,
            v
          );


          renderSummaryOnly();

          updateProductHighlights();

        }


        select.value =
        "";

      }
    );


    control.appendChild(
      input
    );


    control.appendChild(
      select
    );


    row.appendChild(
      nameWrap
    );


    row.appendChild(
      control
    );


    container.appendChild(
      row
    );

  });

}


function updateProductHighlights(){

  document
  .querySelectorAll(
    ".product-row"
  )
  .forEach(row=>{

    const q =
    Number(
      getQty(
        row.dataset.product
      )
    );


    row.classList.toggle(
      "has-qty",

      Number.isFinite(q) &&
      (
        (q >= -30 && q <= -1) ||
        q >= 1
      )

    );

  });

}


function renderSummaryOnly(){

  const items =
  selectedItems();


  const totalQty =
  items.reduce(
    (sum,x)=>
    sum + x.qty,
    0
  );


  const totalAmount =
  items.reduce(
    (sum,x)=>
    sum +
    x.product.price *
    x.qty,
    0
  );


  document.getElementById(
    "sumStore"
  ).textContent =
  state.store || "未選択";


  document.getElementById(
    "sumType"
  ).textContent =
  state.type;


  document.getElementById(
    "sumCount"
  ).textContent =
  items.length +
  "商品";


  document.getElementById(
    "sumQty"
  ).textContent =
  totalQty +
  "個";


  document.getElementById(
    "sumAmount"
  ).textContent =

  state.type === "販売"
  ? yen(totalAmount)
  : "－";


  document.getElementById(
    "selectedProducts"
  ).innerHTML =

  items.length

  ? items.map(x=>`
      <div class="selected-line">
        <span>
          ${x.product.name}
        </span>

        <b>
          ${x.qty}個
        </b>
      </div>
    `).join("")

  : '<div class="note">数量を入力した商品がここに表示されます。</div>';


  registerBtn.disabled =
  !state.store ||
  items.length === 0;

}


function render(){

  [...storeBox.children]
  .forEach(b=>{

    b.classList.toggle(
      "active",
      b.dataset.store ===
      state.store
    );

  });


  saleBtn.classList.toggle(
    "active",
    state.type === "販売"
  );


  deliveryBtn.classList.toggle(
    "active",
    state.type === "納品"
  );


  renderProducts();

  renderSummaryOnly();

  drawHistory();

}


function localHistory(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "toms_batches"
      ) || "[]"
    );

  }catch(e){

    return [];

  }

}


function saveHistory(a){

  localStorage.setItem(
    "toms_batches",
    JSON.stringify(a)
  );

}


function requestAppsScript(params){

  return new Promise(
    (
      resolve,
      reject
    )=>{

      const callbackName =

      "__tomsAction_" +

      Date.now() +

      "_" +

      Math.floor(
        Math.random() *
        100000
      );


      const script =
      document.createElement(
        "script"
      );


      let finished =
      false;


      const cleanup =
      ()=>{

        try{

          delete window[
            callbackName
          ];

        }catch(e){

          window[
            callbackName
          ] =
          undefined;

        }


        if(
          script.parentNode
        ){

          script.parentNode
          .removeChild(
            script
          );

        }

      };


      const timer =
      setTimeout(
        ()=>{

          if(finished)
          return;


          finished =
          true;


          cleanup();


          reject(
            new Error(
              "timeout"
            )
          );

        },
        15000
      );


      window[
        callbackName
      ] =
      result=>{


        if(finished)
        return;


        finished =
        true;


        clearTimeout(
          timer
        );


        cleanup();


        if(
          result &&
          result.ok
        ){

          resolve(
            result
          );

        }else{

          reject(
            new Error(
              (
                result &&
                result.message
              ) ||
              "登録に失敗しました"
            )
          );

        }

      };


      const query =
      new URLSearchParams({
        ...params,
        callback:
        callbackName,
        t:String(
          Date.now()
        )
      });


      script.onerror =
      ()=>{

        if(finished)
        return;


        finished =
        true;


        clearTimeout(
          timer
        );


        cleanup();


        reject(
          new Error(
            "network"
          )
        );

      };


      script.src =

      API_URL +

      "?" +

      query.toString();


      document.head
      .appendChild(
        script
      );

    }
  );

}


async function registerEntries(){

  const items =
  selectedItems();


  if(!state.store){

    alert(
      "店舗を選択してください"
    );

    return;

  }


  if(
    items.length === 0
  ){

    alert(
      "数量を入力してください"
    );

    return;

  }


  const batchId =
  String(
    Date.now()
  );


  const date =
  document.getElementById(
    "date"
  ).value;


  const entries =
  items.map(
    (
      x,
      index
    )=>({

      id:
      batchId +
      "-" +
      index,

      batchId,

      date,

      store:
      state.store,

      type:
      state.type,

      product:
      x.product.name,

      qty:
      x.qty,

      unitPrice:
      state.type === "販売"
      ? x.product.price
      : "",

      amount:
      state.type === "販売"
      ? x.product.price *
        x.qty
      : ""

    })
  );


  setLoading(
    true
  );


  try{


    await requestAppsScript({

      action:
      "submit",

      entries:
      JSON.stringify(
        entries
      )

    });


    const history =
    localHistory();


    history.push({

      batchId,

      date,

      store:
      state.store,

      type:
      state.type,

      items:
      entries.map(
        x=>({

          product:
          x.product,

          qty:
          x.qty

        })
      )

    });


    saveHistory(
      history
    );


    state.quantities =
    {};


    dashboardData =
    null;


    dashboardLoadedAt =
    0;


    setLoading(
      false
    );


    showToast(
      "登録しました"
    );


    render();


    setTimeout(
      ()=>
      loadDashboard(
        true
      ),
      1200
    );


  }catch(err){


    setLoading(
      false
    );


    alert(
      "登録できませんでした。通信状態を確認してください。"
    );

  }

}


async function undoLastBatch(){

  const history =
  localHistory();


  if(
    history.length === 0
  ){

    showToast(
      "取消す登録がありません"
    );

    return;

  }


  const batch =
  history[
    history.length - 1
  ];


  const text =
  batch.items
  .map(
    x=>
    x.product +
    " × " +
    x.qty
  )
  .join("\n");


  if(
    !confirm(
      "直前の登録を取消しますか？\n\n" +
      text
    )
  ){

    return;

  }


  setLoading(
    true
  );


  try{


    await requestAppsScript({

      action:
      "undo",

      batchId:
      batch.batchId

    });


    history.pop();


    saveHistory(
      history
    );


    dashboardData =
    null;


    dashboardLoadedAt =
    0;


    setLoading(
      false
    );


    showToast(
      "取消しました"
    );


    render();


  }catch(err){


    setLoading(
      false
    );


    alert(
      "取消できませんでした。"
    );

  }

}


function drawHistory(){

  const box =
  document.getElementById(
    "history"
  );


  const history =
  localHistory()
  .slice(
    -5
  )
  .reverse();


  if(
    history.length === 0
  ){

    box.innerHTML =
    '<div class="note">まだ登録はありません。</div>';

    return;

  }


  box.innerHTML =
  history.map(
    batch=>{


      const total =
      batch.items
      .reduce(
        (
          sum,
          x
        )=>
        sum +
        x.qty,
        0
      );


      return `

        <div class="history-row">

          <div>

            <b>
              ${batch.type}
            </b>

            ${batch.items.length}商品

            <br>

            ${batch.date}

            ・

            ${batch.store}

          </div>

          <div>

            ${total}個

          </div>

        </div>

      `;

    }
  ).join("");

}


function showToast(msg){

  const t =
  document.getElementById(
    "toast"
  );


  t.textContent =
  msg;


  t.style.display =
  "block";


  setTimeout(
    ()=>
    t.style.display =
    "none",
    1700
  );

}


function setLoading(value){

  document
  .getElementById(
    "app"
  )
  .classList
  .toggle(
    "loading",
    value
  );

}



/* ダッシュボード */

let dashboardData =
null;

let dashboardLoading =
false;

let dashboardLoadedAt =
0;


function switchView(view){

  document
  .querySelectorAll(
    ".app-view"
  )
  .forEach(el=>{

    el.classList.toggle(
      "active",
      el.id ===
      "view-" +
      view
    );

  });


  document
  .querySelectorAll(
    ".top-tab"
  )
  .forEach(btn=>{

    btn.classList.toggle(
      "active",
      btn.dataset.view ===
      view
    );

  });


  if(
    view !== "input"
  ){

    loadDashboard(
      true
    );

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function loadDashboard(force){

  if(
    dashboardLoading
  )
  return;


  dashboardLoading =
  true;


  const callbackName =

  "__tomsDashboard_" +

  Date.now();


  const script =
  document.createElement(
    "script"
  );


  let finished =
  false;


  const cleanup =
  ()=>{

    try{

      delete window[
        callbackName
      ];

    }catch(e){}


    if(
      script.parentNode
    ){

      script.parentNode
      .removeChild(
        script
      );

    }

  };


  const timer =
  setTimeout(
    ()=>{

      if(finished)
      return;


      finished =
      true;


      dashboardLoading =
      false;


      cleanup();

    },
    15000
  );


  window[
    callbackName
  ] =
  data=>{


    if(finished)
    return;


    finished =
    true;


    clearTimeout(
      timer
    );


    dashboardLoading =
    false;


    cleanup();


    if(
      !data ||
      data.ok === false
    ){

      return;

    }


    dashboardData =
    data;


    dashboardLoadedAt =
    Date.now();


    setupProductMonthOptions();


    renderAllDashboard();

  };


  script.src =

  API_URL +

  "?mode=dashboard" +

  "&callback=" +

  encodeURIComponent(
    callbackName
  ) +

  "&t=" +

  Date.now();


  document.head
  .appendChild(
    script
  );

}


function renderAllDashboard(){

  if(
    !dashboardData
  )
  return;


  renderInventory();

  renderMonthly();

  renderProductMonthly();


  const text =

  dashboardData.lastUpdated

  ? "最終登録：" +
    dashboardData.lastUpdated

  : "";


  [
    "inventoryUpdated",
    "monthlyUpdated",
    "productsUpdated"
  ]
  .forEach(id=>{

    document
    .getElementById(
      id
    )
    .textContent =
    text;

  });

}


function setupProductMonthOptions(){

  if(
    !dashboardData
  )
  return;


  const select =
  document.getElementById(
    "productMonth"
  );


  const today =
  localToday()
  .slice(
    0,
    7
  );


  select.innerHTML =
  dashboardData.months
  .map(
    m=>
    `<option value="${m.key}">
      ${m.label}
    </option>`
  )
  .join("");


  if(
    dashboardData.months
    .some(
      m=>
      m.key === today
    )
  ){

    select.value =
    today;

  }

}


function renderInventory(){

  if(
    !dashboardData
  )
  return;


  const store =
  document.getElementById(
    "inventoryStore"
  ).value;


  const rows =

  dashboardData.inventory[
    store
  ] || [];


  const box =
  document.getElementById(
    "inventoryContent"
  );


  box.innerHTML = `

    <div class="dash-table-wrap">

      <table
        class="dash-table inventory-table inventory-only-stock"
      >

        <thead>
          <tr>
            <th>商品名</th>
            <th>在庫</th>
          </tr>
        </thead>

        <tbody>

          ${rows.map(
            r=>`

              <tr>

                <td>
                  ${r.product}
                </td>

                <td>
                  ${r.stock}個
                </td>

              </tr>

            `
          ).join("")}

        </tbody>

      </table>

    </div>

  `;

}


function renderMonthly(){

  if(
    !dashboardData
  )
  return;


  const store =
  document.getElementById(
    "monthlyStore"
  ).value;


  const rows =

  dashboardData.monthly[
    store
  ] || [];


  const box =
  document.getElementById(
    "monthlyContent"
  );


  box.innerHTML = `

    <div class="month-list">

      ${rows.map(
        r=>`

          <div class="month-row">

            <div class="m">
              ${r.label}
            </div>

            <div class="v">
              ${r.qty}個
            </div>

            <div class="v">
              ${yen(r.amount)}
            </div>

          </div>

        `
      ).join("")}

    </div>

  `;

}


function renderProductMonthly(){

  if(
    !dashboardData
  )
  return;


  const store =
  document.getElementById(
    "productStore"
  ).value;


  const month =
  document.getElementById(
    "productMonth"
  ).value;


  const rows =

  (
    dashboardData
    .productMonthly[
      store
    ] || {}
  )[month] || [];


  const sold =
  rows.filter(
    r=>
    Number(
      r.qty
    ) > 0
  );


  const box =
  document.getElementById(
    "productsContent"
  );


  const priceMap = {};


  Object.values(
    STORE_PRODUCTS
  )
  .forEach(products=>{

    products.forEach(p=>{

      if(
        priceMap[p.name] == null
      ){

        priceMap[p.name] =
        p.price;

      }

    });

  });


  const detailRows =
  sold.map(r=>{

    const qty =
    Number(
      r.qty || 0
    );


    const price =
    Number(
      priceMap[
        r.product
      ] || 0
    );


    return {
      product:
      r.product,

      qty,

      amount:
      qty *
      price
    };

  });


  const totalQty =
  detailRows.reduce(
    (sum,r)=>
    sum + r.qty,
    0
  );


  const totalAmount =
  detailRows.reduce(
    (sum,r)=>
    sum + r.amount,
    0
  );


  box.innerHTML = `

    <div
      class="metric"
      style="margin-bottom:10px"
    >
      <div class="metric-label">
        販売個数 合計
      </div>

      <div class="metric-value">
        ${totalQty}個
      </div>
    </div>


    <div
      class="metric"
      style="margin-bottom:10px"
    >
      <div class="metric-label">
        売上金額 合計
      </div>

      <div class="metric-value">
        ${yen(totalAmount)}
      </div>
    </div>


    <div class="dash-table-wrap">

      <table
        class="dash-table"
        style="min-width:0"
      >

        <thead>
          <tr>
            <th>商品名</th>
            <th>販売個数</th>
            <th>売上金額</th>
          </tr>
        </thead>

        <tbody>

          ${detailRows.map(
            r=>`

              <tr>

                <td>
                  ${r.product}
                </td>

                <td>
                  ${r.qty}個
                </td>

                <td>
                  ${yen(r.amount)}
                </td>

              </tr>

            `
          ).join("")}


          <tr>

            <td>
              <b>合計</b>
            </td>

            <td>
              <b>${totalQty}個</b>
            </td>

            <td>
              <b>${yen(totalAmount)}</b>
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  `;

}


window.setType =
setType;

window.registerEntries =
registerEntries;

window.undoLastBatch =
undoLastBatch;

window.switchView =
switchView;

window.loadDashboard =
loadDashboard;

window.renderInventory =
renderInventory;

window.renderMonthly =
renderMonthly;

window.renderProductMonthly =
renderProductMonthly;


render();

</script>
